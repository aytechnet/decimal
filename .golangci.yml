version: "2"
linters:
  settings:
    staticcheck:
      # v1 parity: SA analyses only (v2's "all" would add ST/QF style classes,
      # ~19 findings to triage — enable them in a dedicated cleanup pass if wanted).
      checks:
        - all
        - -ST*
        - -QF*
        - -SA9004
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
        text: Error return value of `(strconv\.ParseInt|strconv\.ParseFloat|NewFromString)` is not checked
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
