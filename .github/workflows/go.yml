# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.20', '1.21', '1.22', '1.23', '1.24' ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v -coverprofile=coverage.txt

    - name: Upload coverage reports to Codecov
      if: matrix.go-version == '1.24'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Job summary
      if: matrix.go-version == '1.24'
      run: |
        cov=$(go tool cover -func=coverage.txt | tail -1 | awk '{print $3}')
        {
          echo "## decimal — report"
          echo ""
          echo "| Check | Result |"
          echo "|---|---|"
          echo "| build (Go 1.20 → 1.24 matrix) | ✅ |"
          echo "| go vet | ✅ clean |"
          echo "| tests | ✅ pass |"
          echo "| coverage (total) | $cov |"
        } >> "$GITHUB_STEP_SUMMARY"

  # lint moved to its own workflow (lint.yml) so it gets a dedicated badge,
  # pinned to a golangci-lint v2 release matching the migrated .golangci.yml.

  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Smoke fuzz NewFromString
      run: go test -run=^$ -fuzz=FuzzNewFromString -fuzztime=20s

    - name: Smoke fuzz NewFromFloat
      run: go test -run=^$ -fuzz=FuzzNewFromFloat -fuzztime=20s

    - name: Smoke fuzz arithmetic round-trip
      run: go test -run=^$ -fuzz=FuzzMarshalUnmarshalBinary -fuzztime=20s

    - name: Job summary
      run: |
        {
          echo "## decimal — fuzz report"
          echo ""
          echo "Smoke fuzzing (20s each) — ✅ no crash:"
          echo "- FuzzNewFromString"
          echo "- FuzzNewFromFloat"
          echo "- FuzzMarshalUnmarshalBinary (arithmetic round-trip)"
        } >> "$GITHUB_STEP_SUMMARY"
