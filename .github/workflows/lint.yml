name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # pinned: validated locally against this exact version (v2 config)
          version: v2.13.2

      - name: Job summary
        run: |
          {
            echo "## decimal — lint report"
            echo ""
            echo "golangci-lint **v2.13.2** — ✅ 0 issues"
            echo ""
            echo "Enabled analyses: staticcheck (SA, minus SA9004 — see .golangci.yml), govet, errcheck, ineffassign, unused."
          } >> "$GITHUB_STEP_SUMMARY"
